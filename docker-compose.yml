name: mv-payment-approval

services:
  # =========================================================================
  # Database Service: PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mv-payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mv_payment}
      POSTGRES_USER: ${POSTGRES_USER:-mv_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mv_admin} -d ${POSTGRES_DB:-mv_payment}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mv-network

  # =========================================================================
  # Cache & Broker Service: Redis 7
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: mv-payment-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-secure_redis_password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-secure_redis_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mv-network

  # =========================================================================
  # Backend API Service: FastAPI (Python 3.12)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mv-payment-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mv_admin}:${POSTGRES_PASSWORD:-secure_postgres_password}@postgres:5432/${POSTGRES_DB:-mv_payment}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379/${REDIS_DB:-0}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; sys_exit = 0 if urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\").getcode() == 200 else 1; exit(sys_exit)'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mv-network

  # =========================================================================
  # Frontend Application: React SPA served with Nginx
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-MV Payment Approval}
    container_name: mv-payment-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - mv-network

  # =========================================================================
  # Reverse Proxy & Gateway: Nginx with SSL termination & security
  # =========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: mv-payment-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O - http://127.0.0.1/healthz | grep ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mv-network

volumes:
  postgres_data:
    name: mv_payment_postgres_data
  redis_data:
    name: mv_payment_redis_data

networks:
  mv-network:
    name: mv_payment_network
    driver: bridge
