user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # Logging Configuration
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # =========================================================================
    # Performance & Network Settings
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # File upload limit across proxy (10MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    # Zone for general API requests (20 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Zone for sensitive auth endpoints (5 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Concurrent connection limit per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Return HTTP 429 when rate limit is exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # =========================================================================
    # Upstream Services (Docker Internal DNS)
    # =========================================================================
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =========================================================================
    # HTTP Server: Redirect to HTTPS & Let's Encrypt Challenge
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME-challenge for Certbot SSL renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Container Health Check (unencrypted)
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Redirect all HTTP requests to HTTPS with permanent 301
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS Server: Reverse Proxy & SSL Termination
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # =====================================================================
        # SSL Certificates (Update paths when certbot certificates are mounted)
        # =====================================================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL Hardening Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # SSL Session Cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # =====================================================================
        # Enterprise Security Headers
        # =====================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Connection concurrency limit (max 50 concurrent connections per IP)
        limit_conn addr_limit 50;

        # =====================================================================
        # API Proxy: Forward /api/ to FastAPI Backend
        # =====================================================================
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for API transactions
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering for performance
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # Stricter rate-limiting specifically for authentication endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # WebSocket Proxy: Real-Time Approval & Payment Notifications
        # =====================================================================
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # =====================================================================
        # Uploads Static Files Proxy / Protected Serving
        # =====================================================================
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "private, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
            # Restrict direct execution of uploaded scripts
            types {
                application/pdf pdf;
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                text/csv csv;
                application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            }
            default_type application/octet-stream;
        }

        # =====================================================================
        # Frontend Application Proxy (React SPA)
        # =====================================================================
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Health Check
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
