# ==============================================================================
# Alembic Migration Configuration
# MV Payment Approval System
# ==============================================================================

[alembic]
# Path to migration scripts folder
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Add current directory to sys.path so app packages can be imported
prepend_sys_path = .

# Timezone for revision timestamps (leave blank for UTC)
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py
sourceless = false

# Version location specification
version_locations = alembic/versions

# Version path separator
version_path_separator = os

# Target database URL (loaded dynamically in env.py from app.config.Settings)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/mv_payment_db


# ==============================================================================
# Logging configuration
# ==============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
